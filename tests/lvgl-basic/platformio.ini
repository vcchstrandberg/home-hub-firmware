; LVGL test for Waveshare ESP32-C6 Touch LCD 1.47.
; Independent of main firmware. Probes whether LVGL builds + renders
; cleanly on this board with the correct pins / JD9853 init.
;
; Build/flash:  pio run -e esp32c6_lvgl_test --target upload
; Monitor:      python3 -c "import serial,time; s=serial.Serial('/dev/cu.usbmodem2301',115200,timeout=1); ..."

[env:esp32c6_lvgl_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem2301
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
lib_deps =
    moononournation/GFX Library for Arduino
    lvgl/lvgl@~8.4.0
