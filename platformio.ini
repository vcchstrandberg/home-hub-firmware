; PlatformIO Project Configuration File
;
; Build and upload:
;   pio run -e uno_r4_wifi           --target upload
;   pio run -e esp32dev              --target upload
;   pio run -e esp32c6_waveshare_lcd --target upload
;   pio run -e esp32s3_waveshare_lcd --target upload
;   pio run -e esp32c6_zero_ili9341  --target upload
;   pio run -e esp32cam              --target upload
;
; OTA (once the target's Phase 0 first-flash-via-USB above has happened at
; least once): pio run -e <env>_ota --target upload --upload-port <device-ip>
; No uno_r4_wifi_ota — OTA is ESP32-only, see docs/production-readiness.md.
;   esp32dev_ota / esp32cam_ota / esp32c6_zero_ota / esp32c6_zero_ili9341_ota
;   / esp32c6_waveshare_lcd_ota / esp32s3_waveshare_lcd_ota

[env]
monitor_speed = 115200

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/uno_r4_wifi
lib_deps =
    bblanchon/ArduinoJson
    olikraus/U8g2@^2.35.10
    ricmoo/QRCode

[env:esp32dev]
platform = espressif32
board = esp32dev
; No override previously — this genuinely does land on arduino-esp32's
; default.csv (two 1.25MB OTA slots, confirmed via the gen_esp32part.py
; decoder against the actual build output, not just assumed). But with OTA
; code added, that slot is now uncomfortably tight for future growth (a
; sibling board hit 95%+ full at the same 1.25MB size) — widened to
; ota_nofs_4MB.csv (two 1.9375MB slots, no spiffs — unused here) for headroom.
; AI-Thinker-style ESP32 DevKits are conventionally 4MB; not hardware-verified
; here since this board isn't connected, but a 4MB-total table is always safe
; even if the real chip is larger — it just leaves the rest unused.
board_build.partitions = ota_nofs_4MB.csv
board_upload.flash_size = 4MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32dev
lib_deps =
    bblanchon/ArduinoJson
    olikraus/U8g2@^2.35.10

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota

[env:esp32cam]
platform = espressif32
board = esp32cam
; IMPORTANT: unlike esp32dev/esp32c6_zero, "no override" here does NOT land
; on default.csv — decoded the actual build output and found a single 3MB
; ota_0 slot with no ota_1, i.e. the same no-rollback problem huge_app.csv
; has. (Both boards use the same `platform = espressif32` with no explicit
; partitions key, so this was a genuine surprise, not something derivable
; from the board JSON alone — the earlier "esp32cam is already OTA-shaped"
; note in docs/production-readiness.md was wrong and has been corrected.)
; AI-Thinker ESP32-CAM is a well-established 4MB-flash module.
board_build.partitions = ota_nofs_4MB.csv
board_upload.flash_size = 4MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32cam
    -DESP32CAM=1
lib_deps =
    bblanchon/ArduinoJson
    olikraus/U8g2@^2.35.10

[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota

[env:esp32c6_zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
; No override previously landed on default.csv (two 1.25MB slots, confirmed
; via the partition decoder) — safe but, with OTA code added, now at 95%+
; full, uncomfortably tight for future growth. Widened to ota_nofs_4MB.csv
; (two 1.9375MB slots, no spiffs — unused here). Real chip is 8MB (confirmed
; via esptool flash-id directly on hardware 2026-08-06) so this 4MB-total
; table leaves half the chip unused, but that's fine — simpler than a custom
; 8MB file, and there's no need to use the rest.
board_build.partitions = ota_nofs_4MB.csv
board_upload.flash_size = 8MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32c6_zero
    -DESP32C6_ZERO=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson
    olikraus/U8g2@^2.35.10

[env:esp32c6_zero_ota]
extends = env:esp32c6_zero
upload_protocol = espota

[env:esp32c6_zero_ili9341]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_mode = dio
; Two-slot OTA-capable scheme (two 3MB app slots) instead of huge_app.csv's
; single 3MB slot with no rollback — see docs/production-readiness.md Phase 0.
; Custom file (no off-the-shelf scheme fits an 8MB chip this way); flash_size
; confirmed 8MB via esptool flash-id directly on hardware 2026-08-06.
board_build.partitions = partitions_c6_8mb_ota.csv
board_upload.flash_size = 8MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32c6_zero_ili9341
    -DESP32C6_ZERO_TFT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Display orientation: 5 = portrait (240x320), 6 = landscape (320x240).
    ; 7 / 4 are the 180-degree siblings. Layout adapts automatically.
    -DTFT_ROTATION=5
lib_deps =
    bblanchon/ArduinoJson
    lovyan03/LovyanGFX@^1.1.16

; OTA Phase 1 — separate env so plain --target upload keeps defaulting to
; USB (needed for the Phase 0 first-flash and as a safe fallback after).
[env:esp32c6_zero_ili9341_ota]
extends = env:esp32c6_zero_ili9341
upload_protocol = espota

[env:esp32c6_waveshare_lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_mode = dio
; Two-slot OTA-capable scheme (two 3MB app slots) instead of huge_app.csv's
; single 3MB slot with no rollback — see docs/production-readiness.md Phase 0.
; Custom file (no off-the-shelf scheme fits an 8MB chip this way); flash_size
; confirmed 8MB via esptool flash-id directly on hardware 2026-08-06.
board_build.partitions = partitions_c6_8mb_ota.csv
board_upload.flash_size = 8MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32c6_waveshare_lcd
    -DWAVESHARE_ESP32C6_LCD=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    bblanchon/ArduinoJson
    moononournation/GFX Library for Arduino
    lvgl/lvgl@~8.4.0
    https://github.com/LiquidCGS/FastIMU.git#1.2.8

; OTA Phase 1 — separate env so plain --target upload keeps defaulting to
; USB (needed for the Phase 0 first-flash and as a safe fallback after).
[env:esp32c6_waveshare_lcd_ota]
extends = env:esp32c6_waveshare_lcd
upload_protocol = espota

[env:esp32s3_waveshare_lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
; Two-slot OTA-capable scheme (two 6.25 MB app slots) instead of huge_app.csv's
; single 3 MB slot with no rollback — see docs/production-readiness.md Phase 0.
; Built into arduino-esp32, sized for this board's real 16 MB chip.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
extra_scripts = pre:scripts/version.py
build_flags =
    -I include/esp32s3_waveshare_lcd
    -DWAVESHARE_ESP32S3_LCD=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    bblanchon/ArduinoJson
    moononournation/GFX Library for Arduino
    lvgl/lvgl@~8.4.0
    https://github.com/LiquidCGS/FastIMU.git#1.2.8

; OTA Phase 1 — separate env so plain `-e esp32s3_waveshare_lcd --target upload`
; keeps defaulting to USB (needed for the first flash of the ArduinoOTA-enabled
; firmware, and as a safe fallback afterwards). Once the listener is running:
;   pio run -e esp32s3_waveshare_lcd_ota --target upload --upload-port <device-ip>
; upload_port is left unset here — it's dynamic (DHCP), passed on the CLI each time.
[env:esp32s3_waveshare_lcd_ota]
extends = env:esp32s3_waveshare_lcd
upload_protocol = espota
